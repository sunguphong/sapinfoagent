# 매일 아침 브리핑 발송 (PC 없이 GitHub Actions 에서 실행).
# 발송 시각은 agents/<id>.json 의 schedule 과 맞춘다. cron 은 UTC 라 KST -9 시간 (전날 날짜).
# GitHub 예약 실행은 실제로 2~3시간씩 늦게 시작된다(2026-10-17~21 관측: 06:55 예약 → 08:40~09:50 시작).
# 그래서 예약은 발송 시각보다 약 3시간 앞당기고, 정시(:00)를 피한 분으로 잡는다.
# 실제 발송은 대부분 PC 의 watchdog.ps1 이 발송 시각 10분 전에 workflow_dispatch(skip_if_sent) 로 시작시킨다. 예약은 PC 가 꺼졌을 때의 대비책.
# 같은 날 두 번 보내지 않도록 성공 시 ci-state 의 logs/<id>/last-sent.txt 에 날짜를 남기고, 예약 실행은 이를 보고 건너뛴다.
#
# 필요한 저장소 Secrets: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token), SMTP_USER, SMTP_PASS, MAIL_TO
# 에이전트 간 실행 기록(seen.json, runs.json, last-sent.txt)은 ci-state 브랜치의 logs/<id>/ 에, 발송본(html, digest)은
# output/<id>/ 에 보관한다. PC 의 관리 웹(src/ci-sync.js)이 이를 받아와 실행 기록·발송 메일 목록에 함께 보여 준다.
name: briefing

on:
  schedule:
    - cron: "7 19 * * *"    # 04:07 KST  sap        (발송 목표 06:55)
    - cron: "11 19 * * *"   # 04:11 KST  realestate, sapmm-jobs (07:00)
    - cron: "11 19 * * 0-4" # 04:11 KST 평일  stock  (07:00)
    - cron: "13 20 * * *"   # 05:13 KST  skincare   (08:00)
    - cron: "21 19 * * *"   # 04:21 KST  ces        (07:30)
  workflow_dispatch:
    inputs:
      agents:
        description: "실행할 에이전트 id (쉼표 구분, 예: sap,stock)"
        required: true
        default: "sap"
      dry_run:
        description: "메일 없이 HTML 만 생성"
        type: boolean
        default: true
      skip_if_sent:
        description: "오늘 이미 발송한 에이전트는 건너뜀 (PC 백업 실행용)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      agents: ${{ steps.p.outputs.agents }}
    steps:
      - id: p
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.agents }}
        run: |
          case "$SCHED" in
            "7 19 * * *")    list="sap" ;;
            "11 19 * * *")   list="realestate,sapmm-jobs" ;;
            "11 19 * * 0-4") list="stock" ;;
            "13 20 * * *")   list="skincare" ;;
            "21 19 * * *")   list="ces" ;;
            *)              list="$INPUT" ;;
          esac
          echo "agents=$(echo "$list" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  run:
    needs: pick
    if: needs.pick.outputs.agents != '[]'   # 예약 시각을 바꾼 직후 옛 예약이 늦게 도착하면 대상이 비어 있다
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.pick.outputs.agents) }}
    concurrency: briefing-${{ matrix.agent }}
    env:
      TZ: Asia/Seoul
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code

      - name: 이전 기록 불러오기 (ci-state)
        run: |
          if git fetch --depth=1 origin ci-state 2>/dev/null; then
            mkdir -p logs/${{ matrix.agent }}
            git archive FETCH_HEAD logs/${{ matrix.agent }} 2>/dev/null | tar -x || true
          fi

      - name: 오늘 이미 발송했는지 확인
        id: sent
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event.inputs.skip_if_sent }}" = true ]; then
            if [ "$(cat logs/${{ matrix.agent }}/last-sent.txt 2>/dev/null)" = "$(date +%F)" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=${{ matrix.agent }}::오늘($(date +%F)) 이미 발송해 건너뜀"
            fi
          fi

      - name: 실행
        if: steps.sent.outputs.skip != 'true'
        run: node src/index.js --source=github --agent=${{ matrix.agent }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: 오류 요약 (Annotations 에 표시)
        if: failure()
        run: |
          msg=$(tail -n 12 logs/${{ matrix.agent }}/run-*.log 2>/dev/null | cut -c1-400)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=${{ matrix.agent }} 실행 실패::${msg:-실행 로그 없음}"

      - name: 실패 알림 메일
        if: failure() || cancelled()
        run: node src/alert.js ${{ matrix.agent }} "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 기록 저장 (ci-state)
        if: always() && steps.sent.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          a=${{ matrix.agent }}
          mkdir -p /tmp/state /tmp/out
          [ "${{ job.status }}" = success ] && date +%F > /tmp/state/last-sent.txt
          for f in seen.json runs.json; do [ -f logs/$a/$f ] && cp logs/$a/$f /tmp/state/; done
          cp output/$a/*.html output/$a/*-digest.json /tmp/out/ 2>/dev/null || true
          ls /tmp/state/* >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if git fetch --depth=1 origin ci-state 2>/dev/null; then git checkout -f -B ci-state FETCH_HEAD; else git checkout --orphan ci-state && git rm -rfq .; fi
            mkdir -p logs/$a output/$a && cp /tmp/state/* logs/$a/; cp /tmp/out/* output/$a/ 2>/dev/null || true
            git add -f logs/$a/ output/$a/
            git diff --cached --quiet && exit 0
            git commit -qm "state: $a $(date +%F)"
            git push origin ci-state && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/upload-artifact@v6
        if: always() && steps.sent.outputs.skip != 'true'
        with:
          name: ${{ matrix.agent }}-${{ github.run_id }}
          path: |
            output/${{ matrix.agent }}/
            logs/${{ matrix.agent }}/run-*.log
          retention-days: 30
